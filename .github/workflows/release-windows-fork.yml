name: Release (Windows only, fork test)

# Windows-only build of the upstream release flow, for testing unreleased features
# on a fork. Skips signing, macOS, Linux, Flatpak, FreeBSD, web and the draft release.
# Run: Actions -> "Release (Windows only, fork test)" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test version, e.g. 0.0.0-fork.1 (empty: Cargo.toml)"
        type: string
        default: ""
      arches:
        description: "Architectures (JSON array)"
        type: string
        default: '["x64"]'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        uses: storytold/craft-common-actions/actions/resolve-version@main
        with:
          input-version: ${{ inputs.version }}
          app-title: WordCraft

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Rust target
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x64) t=x86_64-pc-windows-msvc ;;
            x86) t=i686-pc-windows-msvc ;;
            arm64) t=aarch64-pc-windows-msvc ;;
            *) echo "bad arch"; exit 1 ;;
          esac
          echo "TARGET=$t" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$VERSION"
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: "5.0.2"
      - name: Build and package (unsigned)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
